<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday!</title>
    <!-- 폭죽(Confetti) 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            max-width: 360px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        h1 {
            font-size: 28px;
            color: #ff4757;
            margin-bottom: 8px;
            font-weight: 800;
        }

        p.subtitle {
            font-size: 14px;
            color: #747d8c;
            margin-bottom: 30px;
        }

        /* 케이크 & 촛불 스타일 */
        .cake-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            cursor: pointer;
        }

        .cake {
            font-size: 80px;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .flame {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 26px;
            background: radial-gradient(ellipse at bottom, #ffee55 0%, #ff6b6b 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ff4757;
            animation: flicker 0.1s infinite alternate;
            transition: opacity 0.5s ease;
        }

        .flame.off {
            opacity: 0;
            animation: none;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1.1) rotate(2deg); }
        }

        /* 메시지 상자 */
        .message-box {
            background: #fff0f3;
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            border: 2px dashed #ff4757;
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }

        .message-box h2 {
            font-size: 20px;
            color: #ff4757;
            margin-bottom: 10px;
        }

        .message-box p {
            font-size: 15px;
            color: #2f3542;
            line-height: 1.6;
        }

        .instruction {
            font-size: 13px;
            color: #ff6b81;
            font-weight: 600;
            margin-top: 10px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>경북대학원 심리학과<br>노예n호에게</h1>
        <p class="subtitle"></p>

        <div class="cake-container" id="cakeContainer" onclick="blowOutCandle()">
            <div class="flame" id="flame"></div>
            <div class="cake">🎂</div>
        </div>

        <div class="instruction" id="instruction">
            촛불 요령껏 꺼보셈
        </div>

        <div class="message-box" id="messageBox">
            <h2>🎂 Happy Birthday! 🎂</h2>
            <p>거지 백수라 선물은 없고<br>최근에 알게된 기술로 만들어봄<br>터치로 껐다면 실망이고<br>흔들어서 껐다면 심리고수 ㅇㅈ해드림</p>
        </div>
    </div>

    <script>
        let isBlown = false;

        // 촛불 끄기 및 폭죽 이벤트
        function blowOutCandle() {
            if (isBlown) return;
            isBlown = true;

            // 촛불 꺼짐
            document.getElementById('flame').classList.add('off');
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('messageBox').style.display = 'block';

            // 폭죽 터트리기 (Confetti)
            triggerConfetti();
        }

        function triggerConfetti() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff4757', '#ffee55'] });
            fire(0.2, { spread: 60, colors: ['#70a1ff', '#2ed573'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        // 스마트폰 흔들림 감지 (가속도 센서)
        let lastX, lastY, lastZ;
        let shakeThreshold = 15; // 흔들림 감도

        function initShakeSensor() {
            if (typeof DeviceMotionEvent !== 'undefined') {
                // iOS 13+ 권한 요청 처리
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    document.body.addEventListener('click', function() {
                        DeviceMotionEvent.requestPermission().then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('devicemotion', handleMotion);
                            }
                        });
                    }, { once: true });
                } else {
                    window.addEventListener('devicemotion', handleMotion);
                }
            }
        }

        function handleMotion(event) {
            let current = event.accelerationIncludingGravity;
            if (!current || !current.x) return;

            if (lastX !== undefined) {
                let deltaX = Math.abs(current.x - lastX);
                let deltaY = Math.abs(current.y - lastY);
                let deltaZ = Math.abs(current.z - lastZ);

                if (deltaX + deltaY + deltaZ > shakeThreshold) {
                    blowOutCandle();
                }
            }

            lastX = current.x;
            lastY = current.y;
            lastZ = current.z;
        }

        initShakeSensor();
    </script>
</body>
</html>
